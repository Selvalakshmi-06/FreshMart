<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart - Login</title>

    <link rel="stylesheet" href="../CSS/style.css">

    <style>
        .login-section {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card p {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            display: none;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                🛒 FreshMart
            </a>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    🛒 Cart
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= LOGIN SECTION ================= -->

    <main class="login-section">

        <div class="login-card">

            <h1>Welcome Back!</h1>

            <p>Login to your FreshMart account</p>

            <div id="loginError" class="error-message">
                Invalid email or password.
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Register here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../JAVASCRIPT/login.js"></script>

</body>

</html>
