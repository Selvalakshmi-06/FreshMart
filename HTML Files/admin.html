<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: #2e7d32;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: white;
            color: #2e7d32;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2e7d32;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f3f4;
        }

        select {
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .message {
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>FreshMart Admin Dashboard</h1>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

    <div class="container">

        <!-- SUMMARY CARDS -->

        <div class="cards">

            <div class="card">
                <h3>Total Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>

            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

        </div>


        <!-- ORDERS -->

        <div class="section">

            <h2>📦 All Orders</h2>

            <div id="orderMessage" class="message"></div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Customer</th>
                            <th>Products</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Address</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="ordersTable">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- USERS -->

        <div class="section">

            <h2>👥 All Users</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>

                    </thead>

                    <tbody id="usersTable">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="section">

            <h2>🛒 Products</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Category</th>
                        </tr>

                    </thead>

                    <tbody id="productsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        const API_URL = "http://localhost:5000";

        const token = localStorage.getItem("freshmartToken");


        // =========================================
        // CHECK LOGIN
        // =========================================

        if (!token) {

            alert("Please login as admin");

            window.location.href = "login.html";

        }


        // =========================================
        // LOAD ORDERS
        // =========================================

        async function loadOrders() {

            try {

                const response = await fetch(
                    API_URL + "/api/admin/orders",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Failed to load orders"
                    );

                }

                const orders = data.orders || [];

                document.getElementById("totalOrders").textContent =
                    orders.length;


                const table =
                    document.getElementById("ordersTable");

                table.innerHTML = "";


                orders.forEach(order => {

                    const row =
                        document.createElement("tr");


                    const products =
                        order.items.map(item => {

                            return (
                                item.name +
                                " × " +
                                item.quantity
                            );

                        }).join("<br>");


                    const address =
                        order.shippingAddress
                            ? (
                                order.shippingAddress.name +
                                "<br>" +
                                order.shippingAddress.phone +
                                "<br>" +
                                order.shippingAddress.address +
                                ", " +
                                order.shippingAddress.city +
                                "<br>" +
                                order.shippingAddress.pincode
                            )
                            : "N/A";


                    row.innerHTML = `

                        <td>
                            ${
                                order.userId &&
                                order.userId.name
                                    ? order.userId.name
                                    : "Customer"
                            }
                        </td>

                        <td>
                            ${products}
                        </td>

                        <td>
                            ₹${Number(order.totalAmount).toFixed(2)}
                        </td>

                        <td>
                            ${order.paymentMethod}
                        </td>

                        <td>
                            ${address}
                        </td>

                        <td>

                            <select
                                onchange="updateOrderStatus(
                                    '${order._id}',
                                    this.value
                                )"
                            >

                                <option value="Pending"
                                    ${order.status === "Pending" ? "selected" : ""}>
                                    Pending
                                </option>

                                <option value="Confirmed"
                                    ${order.status === "Confirmed" ? "selected" : ""}>
                                    Confirmed
                                </option>

                                <option value="Shipped"
                                    ${order.status === "Shipped" ? "selected" : ""}>
                                    Shipped
                                </option>

                                <option value="Delivered"
                                    ${order.status === "Delivered" ? "selected" : ""}>
                                    Delivered
                                </option>

                                <option value="Cancelled"
                                    ${order.status === "Cancelled" ? "selected" : ""}>
                                    Cancelled
                                </option>

                            </select>

                        </td>

                    `;


                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "orderMessage"
                ).textContent =
                    error.message;

            }

        }


        // =========================================
        // UPDATE ORDER STATUS
        // =========================================

        async function updateOrderStatus(orderId, status) {

            try {

                const response = await fetch(

                    API_URL +
                    "/api/admin/orders/" +
                    orderId +
                    "/status",

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token

                        },

                        body: JSON.stringify({
                            status: status
                        })

                    }

                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to update order"
                    );

                }


                alert(
                    "Order status updated successfully"
                );


                loadOrders();

            } catch (error) {

                alert(error.message);

            }

        }


        // =========================================
        // LOAD USERS
        // =========================================

        async function loadUsers() {

            try {

                const response = await fetch(

                    API_URL +
                    "/api/admin/users",

                    {

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }

                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load users"
                    );

                }


                const users =
                    data.users || [];


                document.getElementById(
                    "totalUsers"
                ).textContent =
                    users.length;


                const table =
                    document.getElementById(
                        "usersTable"
                    );


                table.innerHTML = "";


                users.forEach(user => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${user.name}
                        </td>

                        <td>
                            ${user.email}
                        </td>

                        <td>
                            ${user.role || "user"}
                        </td>

                    `;


                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

            }

        }


        // =========================================
        // LOAD PRODUCTS
        // =========================================

        async function loadProducts() {

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/products"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load products"
                    );

                }


                const products =
                    data.products || [];


                document.getElementById(
                    "totalProducts"
                ).textContent =
                    products.length;


                const table =
                    document.getElementById(
                        "productsTable"
                    );


                table.innerHTML = "";


                products.forEach(product => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${product.name}
                        </td>

                        <td>
                            ₹${Number(product.price).toFixed(2)}
                        </td>

                        <td>
                            ${product.quantity}
                        </td>

                        <td>
                            ${product.category}
                        </td>

                    `;


                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

       function logout() {

    localStorage.removeItem("freshmartToken");
    localStorage.removeItem("freshmartUser");

    window.location.href = "login.html";
} 


        // =========================================
        // LOAD EVERYTHING
        // =========================================

        loadOrders();
        loadUsers();
        loadProducts();

    </script>

</body>

</html>
